<!DOCTYPE html>
{% load static %}

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Login</title>

    <link rel="stylesheet"
          href="{% static 'css/userlogin.css' %}">

</head>

<body>

    <nav class="navbar">

        <div class="navbar-logo">
            <span>♻</span>
            Aluminum Recovery
        </div>

        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/register/">Register</a>
        </div>

    </nav>


    <div class="login-container">


        <div class="login-card">

            <div class="login-icon">👤</div>

            <h1>
                User Login
            </h1>


            <!-- Django Messages -->

            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <div class="message {{ message.tags }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}


            <!-- Login Form -->

            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>


            </form>


            <p class="register-text">

                Don't have an account?

                <a href="/register/">
                    Register
                </a>

            </p>


        </div>


    </div>


</body>

</html>
